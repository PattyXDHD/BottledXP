  use: true
  block: 'EMERALD_BLOCK'
  usedItem: 'GLASS_BOTTLE'
  bottlesPerClick: 1
  useHotbarMessage: true
  filledMessage: '&aDu kannst noch &e%bottles% XP-Flaschen &afüllen.'
  filledAllMessage: '&aDu hast insgesamt &e%bottles% XP-Flaschen &aabgefüllt.'
